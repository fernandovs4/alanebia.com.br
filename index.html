<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alane Bia</title>
  <meta name="description" content="alanebia.com.br — em breve.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231d1d1f'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='system-ui' font-size='26' fill='%23fff'%3EA%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #faf9f7;
      --fg: #1d1d1f;
      --muted: #6e6e73;
      --line: #e5e3df;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141416; --fg: #f5f5f7; --muted: #9a9aa0; --line: #2a2a2e; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 36rem; text-align: center; }
    h1 {
      font-size: clamp(2.25rem, 8vw, 4rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      margin: 0 0 0.75rem;
    }
    p { color: var(--muted); font-size: 1.125rem; line-height: 1.5; margin: 0; }
    hr { border: 0; border-top: 1px solid var(--line); width: 3rem; margin: 2rem auto; }
    footer { color: var(--muted); font-size: 0.875rem; }
    a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
    a:hover { border-color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>Alane Bia</h1>
    <p>Em breve.</p>
    <hr>
    <footer><a href="https://alanebia.com.br">alanebia.com.br</a></footer>
  </main>
</body>
</html>
